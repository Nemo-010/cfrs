[package]
name = "cfrs"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
license = "0BSD"
description = "Library and CLI that expose anything (HTTP, HTTPS, WebSocket, TCP, unix sockets, directories, files) on the public Electrosphere through Cloudflare tunnels, quick or named."
repository = "https://github.com/Nemo-010/cfrs"
readme = "README.md"
keywords = ["cloudflare", "tunnel", "trycloudflare", "quic", "reverse-proxy"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "cfrs"
path = "src/lib.rs"

[[bin]]
name = "cfrs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
cloudflare-quick-tunnel = "=0.3.1"
futures = "0.3"
getrandom = "0.3"
h2 = "0.4"
httparse = "1"
http = "1"
http-body-util = "0.1"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
quinn = "0.11"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pemfile = "2"
rustls-pki-types = "1"
russh = "0.64"
ssh-key = { version = "0.7.0-rc.11", features = ["getrandom"] }
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
hickory-resolver = { version = "0.24", default-features = false, features = [
    "tokio-runtime",
    "system-config",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
smoltcp = { version = "=0.11.0", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-util",
    "net",
    "time",
    "sync",
    "signal",
    "fs",
    "process",
] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "0.26"
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
